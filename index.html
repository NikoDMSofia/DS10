<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Временно недостъпен</title>
  <style>
    :root{--bg:#0b0d10;--surface:#12151a;--text:#f5f7f9;--muted:#9aa2ad;--red:#d9323e;--line:rgba(255,255,255,.09)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;background:radial-gradient(circle at 15% 20%,rgba(217,50,62,.13),transparent 28rem),radial-gradient(circle at 85% 80%,rgba(217,50,62,.07),transparent 30rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    .glow{position:fixed;width:420px;height:420px;border-radius:50%;background:var(--red);filter:blur(130px);opacity:.08;pointer-events:none;animation:float 8s ease-in-out infinite}
    .glow.one{top:-180px;right:-120px}.glow.two{bottom:-220px;left:-160px;animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(25px) scale(1.08)}}
    .card{position:relative;width:min(760px,100%);padding:clamp(34px,7vw,72px);border:1px solid var(--line);border-radius:30px;background:rgba(18,21,26,.78);box-shadow:0 30px 90px rgba(0,0,0,.38);backdrop-filter:blur(18px);text-align:center}
    .status{display:inline-flex;align-items:center;gap:10px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 6px rgba(217,50,62,.11);animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.15);opacity:1}}
    h1{margin:28px auto 18px;max-width:650px;font-size:clamp(42px,7vw,76px);line-height:.96;letter-spacing:-.05em}
    h1 span{color:var(--red)}
    p{max-width:610px;margin:0 auto;color:var(--muted);font-size:clamp(17px,2.2vw,21px);line-height:1.7}
    .divider{width:72px;height:1px;margin:34px auto;background:linear-gradient(90deg,transparent,var(--red),transparent)}
    .small{font-size:14px;color:#747b84}
    .loader{width:54px;height:54px;margin:28px auto 0;border-radius:50%;border:2px solid rgba(255,255,255,.08);border-top-color:var(--red);animation:spin 1.1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){body{padding:14px}.card{border-radius:24px}h1{font-size:44px}p{font-size:17px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>
  <main class="card">
    <div class="status"><span class="dot"></span>Временно недостъпен</div>
    <h1>Изграждаме нещо <span>по-добро.</span></h1>
    <p>Сайтът е временно затворен, докато работим по нова, по-бърза и по-добра платформа. Скоро ще се върнем с изцяло обновено изживяване.</p>
    <div class="divider"></div>
    <p class="small">Благодарим за търпението и разбирането.</p>
    <div class="loader" aria-hidden="true"></div>
  </main>
</body>
</html>
